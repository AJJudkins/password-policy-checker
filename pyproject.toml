[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "password-policy-checker"
version = "0.2.0"
description = "Check TEST passwords against a policy; never prints the passwords."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
password-policy-checker = "checker:main"

[tool.setuptools]
py-modules = ["checker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
